name: data-science-in-esm-weather
services:
  pilot:
    image: data-science-in-esm-weather:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
    init: true
    command: ["python", "OpenMeteoPilot.py"]
  match:
    image: data-science-in-esm-weather:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
    init: true
    command: ["python", "OpenMeteoMatch.py"]
  ml:
    image: data-science-in-esm-weather:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ../data:/app/data
      - ../outputs:/app/outputs
    init: true
    command: ["python", "UKDayAheadWeatherML.py", "--cutout", "data/uk-era5-2025-01-02-to-2026-01-02.nc", "--output-dir", "outputs/container/day-ahead-weather"]
